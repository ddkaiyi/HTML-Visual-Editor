            overflow: hidden;

        .lang-switch button {
            border: 0;
            background: transparent;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 11px;
            cursor: pointer;
            min-width: 44px;
            line-height: 1.2;
        }
        .lang-switch button.active {
            background: #00E6A5;
            color: #0b0f19;
        }
        .lang-switch button:hover:not(.active) {
            color: #e2e8f0;
        }
        .link_button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #00E6A5;
            color: #0b0f19;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 230, 165, 0.25);
        }
        .link_button:hover {
            background: #34f0bc;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(0, 230, 165, 0.35);
            color: #0b0f19;
        }
    </style>

        let currentTab = 'cover';

        function getTabOrder() {
            const tabs = [];
            dashboardData.forEach(item => {
                if (item.type === 'tab_button' && !tabs.includes(item.targetTab)) {
                    tabs.push(item.targetTab);
                }
            });
            return tabs;
        }
        let tabOrder = getTabOrder();

        function switchToTab(tabId) {
            if (tabId && tabOrder.includes(tabId)) {
                currentTab = tabId;
                renderEngine();
            }
        }

        function nextTab() {
            const idx = tabOrder.indexOf(currentTab);
            if (idx < tabOrder.length - 1) switchToTab(tabOrder[idx + 1]);
        }

        function prevTab() {
            const idx = tabOrder.indexOf(currentTab);
            if (idx > 0) switchToTab(tabOrder[idx - 1]);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                nextTab();
            } else if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                prevTab();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextTab();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevTab();
            }
        });

            canvas.innerHTML = '';
            dashboardData.forEach(item => {
                if (item.tab !== 'all' && item.tab !== currentTab) return;
                canvas.appendChild(renderNode(item));

            document.querySelectorAll('.tab_button').forEach(el => {
                const ref = el.__dataRef;
                if (ref && ref.type === 'tab_button') {
                    el.classList.toggle('active', currentTab === ref.targetTab);

            initCharts();

        function renderNode(nodeData) {

            el.__dataRef = nodeData;
            el.style.left = nodeData.x + 'px';
            el.style.top = nodeData.y + 'px';
            if (nodeData.width) el.style.width = nodeData.width + 'px';
            if (nodeData.height) el.style.height = nodeData.height + 'px';

            if (nodeData.type === 'text') {
                el.innerText = nodeData.text;
                el.style.fontSize = nodeData.fontSize + 'px';
                el.style.color = nodeData.color || '#fff';
                if (nodeData.fontWeight) el.style.fontWeight = nodeData.fontWeight;
                el.style.whiteSpace = 'nowrap';
                if (nodeData.letterSpacing) el.style.letterSpacing = nodeData.letterSpacing + 'px';
            } else if (nodeData.type === 'rect') {
                el.style.background = nodeData.bg;
                if (nodeData.border) el.style.border = nodeData.border;
                if (nodeData.radius) el.style.borderRadius = nodeData.radius + 'px';
                if (nodeData.shadow) el.style.boxShadow = nodeData.shadow;
            } else if (nodeData.type === 'line') {
                el.style.background = nodeData.color;
                if (nodeData.radius) el.style.borderRadius = nodeData.radius + 'px';
            } else if (nodeData.type === 'tab_button') {
                el.innerText = nodeData.text;
                el.style.fontSize = nodeData.fontSize + 'px';
                el.style.fontWeight = nodeData.fontWeight;
                el.style.color = (currentTab === nodeData.targetTab) ? '#00E6A5' : '#64748b';
                el.style.cursor = 'pointer';
                el.addEventListener('click', () => {
                    currentTab = nodeData.targetTab;
                    renderEngine();
                });
            } else if (nodeData.type === 'link_button') {
                const a = document.createElement('a');
                a.className = 'link_button';
                a.href = nodeData.href || 'editor.html';
                a.textContent = nodeData.text || 'Open Editor';
                a.style.width = '100%';

            } else if (nodeData.type === 'group' && nodeData.children) {
                nodeData.children.forEach(child => el.appendChild(renderNode(child)));
